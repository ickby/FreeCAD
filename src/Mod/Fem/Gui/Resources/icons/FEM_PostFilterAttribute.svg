<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   id="svg-fem-postfilter-attribute"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <metadata id="metadata-fem-postfilter-attribute">
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:format>image/svg+xml</dc:format>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
        <dc:title>FEM_PostFilterAttribute</dc:title>
        <dc:date>2026-09-06</dc:date>
        <dc:relation>https://www.freecad.org/wiki/index.php?title=Artwork</dc:relation>
        <dc:publisher>
          <cc:Agent>
            <dc:title>FreeCAD</dc:title>
          </cc:Agent>
        </dc:publisher>
        <dc:rights>
          <cc:Agent>
            <dc:title>FreeCAD LGPL2+</dc:title>
          </cc:Agent>
        </dc:rights>
        <cc:license>https://www.gnu.org/copyleft/lesser.html</cc:license>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <!--
    Four pieces of a model, two of them picked out. The dropped pair is drawn
    in outline rather than in a paler fill so it reads the same on a light and
    on a dark panel: what carries the shape there is the dark stroke every
    other FEM post filter icon uses, not a tint that one of the two themes
    would swallow.
  -->
  <g
     style="stroke:#172a04;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round">
    <path
       id="piece-dropped-top"
       style="fill:none;stroke-dasharray:4.4,3.6"
       d="M 5,20 17,13 29,20 17,27 Z" />
    <path
       id="piece-dropped-bottom"
       style="fill:none;stroke-dasharray:4.4,3.6"
       d="M 5,44 17,37 29,44 17,51 Z" />
    <path
       id="piece-kept-top"
       style="fill:#5bae0c"
       d="M 33,20 45,13 57,20 45,27 Z" />
    <path
       id="piece-kept-bottom"
       style="fill:#5bae0c"
       d="M 33,44 45,37 57,44 45,51 Z" />
    <path
       id="pick-mark"
       style="fill:none;stroke-width:5;stroke:#172a04"
       d="M 38,32.5 43.5,38 56,25.5" />
    <path
       id="pick-mark-inner"
       style="fill:none;stroke-width:2.4;stroke:#5bae0c"
       d="M 38,32.5 43.5,38 56,25.5" />
  </g>
</svg>
