<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   id="svg-fem-postfilter-attribute"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <metadata id="metadata-fem-postfilter-attribute">
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:format>image/svg+xml</dc:format>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
        <dc:title>FEM_PostFilterAttribute</dc:title>
        <dc:date>2026-09-06</dc:date>
        <dc:relation>https://www.freecad.org/wiki/index.php?title=Artwork</dc:relation>
        <dc:publisher>
          <cc:Agent>
            <dc:title>FreeCAD</dc:title>
          </cc:Agent>
        </dc:publisher>
        <dc:rights>
          <cc:Agent>
            <dc:title>FreeCAD LGPL2+</dc:title>
          </cc:Agent>
        </dc:rights>
        <cc:license>https://www.gnu.org/copyleft/lesser.html</cc:license>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <!--
    Two pieces of a model, one kept and one left behind.

    Every face is filled, which is what lets the icon work on a dark panel as
    well as a light one: the pale fills carry the silhouette where a dark
    outline would disappear into the background, and the dark outlines carry it
    against a light one. Drawing the dropped piece as an unfilled outline - the
    obvious way to say "not this one" - would make it vanish on dark, so it is
    told apart by tone instead, the same washed-out grey the mesh view already
    uses for geometry that is there but not being solved on.

    Two solids rather than four smaller ones, set on the diagonal so they reach
    both corners: the toolbar renders this at sixteen pixels, where a shape
    under a third of the canvas is a smudge.
  -->
  <g style="stroke-linejoin:round;stroke-linecap:round;stroke-width:2.4">
    <!-- dropped: the piece the filter leaves out, further back -->
    <g style="stroke:#2e3436">
      <path id="drop-left" style="fill:#babdb6" d="M 3,14.5 18,23 18,40 3,31.5 Z" />
      <path id="drop-right" style="fill:#d3d7cf" d="M 33,14.5 18,23 18,40 33,31.5 Z" />
      <path id="drop-top" style="fill:#eeeeec" d="M 18,6 33,14.5 18,23 3,14.5 Z" />
    </g>
    <!-- kept: the piece a checked entity stands for, nearer and drawn over it -->
    <g style="stroke:#172a04">
      <path id="keep-left" style="fill:#5bae0c" d="M 30,32.5 45,41 45,58 30,49.5 Z" />
      <path id="keep-right" style="fill:#8ae234" d="M 60,32.5 45,41 45,58 60,49.5 Z" />
      <path id="keep-top" style="fill:#b7f269" d="M 45,24 60,32.5 45,41 30,32.5 Z" />
    </g>
  </g>
</svg>
